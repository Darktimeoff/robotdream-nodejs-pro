name: homework-5
services:
  api:
    build: {context: ., dockerfile: ./Dockerfile}
    image: homework5-server
    ports: ["3000:3000"]
    environment:
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: postgres_db
    restart: no
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
volumes:
  postgres_data:
